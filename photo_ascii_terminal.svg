<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 486" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; rx: 10px; }
      .term-header { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .term-title { fill: #8b949e; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; }
      .prompt { fill: #00ff7f; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; }
      .command { fill: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      
      .line-group {
        opacity: 0;
        animation: fadeInLine 0.2s forwards;
      }

      @keyframes fadeInLine {
        to { opacity: 1; }
      }

      .cursor {
        animation: blink 0.8s infinite;
        fill: #00e5ff;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="476" height="480" class="term-bg" />

  <!-- Terminal Window Titlebar -->
  <path d="M 2 12 Q 2 2 12 2 L 468 2 Q 478 2 478 12 L 478 36 L 2 36 Z" class="term-header" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  <text x="240" y="23" text-anchor="middle" class="term-title">bash - photo_ascii_render.sh (44x24)</text>

  <!-- Command Input -->
  <text x="20" y="55" class="prompt">❯ ./render_ascii_portrait --photo 1000149864.jpg</text>

  <!-- ASCII Lines -->
  
    <g class="line-group" style="animation-delay: 0.00s;">
