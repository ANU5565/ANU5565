  <!-- Footer Prompt -->
  <g class="line-group" style="animation-delay: 3.38s;">
    <text x="20" y="421" class="prompt">❯ Photo ASCII Rendered Successfully.</text>
    <rect x="285" y="411" width="8" height="13" class="cursor" />
