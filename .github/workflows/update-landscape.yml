name: Update contribution landscape

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate current contribution landscape
        run: python3 .github/scripts/generate-landscape.py

      - name: Commit updated landscape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landscape.svg
          git diff --cached --quiet || git commit -m "Update contribution landscape"
          git push
